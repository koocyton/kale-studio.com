<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <title>Play Tube</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        #player {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            border: none;
            background: #000;
        }

        #error {
            display: none;
            width: 100%;
            height: 100%;
            align-items: center;
            justify-content: center;
            background: #000;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            text-align: center;
            padding: 20px;
        }

        #error.show {
            display: flex;
        }
    </style>
</head>
<body>
    <!-- /watch 不能被嵌套；只用官方 /embed，整页铺满这一条视频 -->
    <iframe
        id="player"
        title="YouTube video player"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share; fullscreen"
        allowfullscreen
        referrerpolicy="strict-origin-when-cross-origin"
    ></iframe>
    <div id="error">
        <div>
            <h2>Unable to load video</h2>
            <p style="margin-top: 10px; opacity: 0.7;" id="errorMsg">Please check if the video ID is correct.</p>
            <button id="openBtn" style="
                margin-top: 20px;
                padding: 12px 24px;
                background: #ff0000;
                color: white;
                border: none;
                border-radius: 4px;
                font-size: 16px;
                cursor: pointer;
                display: none;
            ">Open in the YouTube app</button>
        </div>
    </div>

    <script>
        let currentVideoId = null;

        function extractVideoId(raw) {
            if (!raw) return null;
            let value = raw.trim();
            try {
                value = decodeURIComponent(value);
            } catch (e) {}

            if (/^[\w-]{11}$/.test(value)) return value;

            const fromUrl = value.match(/(?:[?&]v=|youtu\.be\/|\/embed\/|\/shorts\/|\/live\/)([\w-]{11})/);
            return fromUrl ? fromUrl[1] : null;
        }

        function getVideoId() {
            const hash = window.location.hash || '';
            const hashMatch = hash.match(/(?:^#|&)vid=([^&]+)/);
            if (hashMatch) return extractVideoId(hashMatch[1]);

            const params = new URLSearchParams(window.location.search);
            return extractVideoId(params.get('vid') || params.get('v') || '');
        }

        function showError(message) {
            const player = document.getElementById('player');
            const error = document.getElementById('error');
            const errorMsg = document.getElementById('errorMsg');
            const openBtn = document.getElementById('openBtn');

            player.style.display = 'none';
            error.classList.add('show');
            errorMsg.textContent = message;

            if (currentVideoId) {
                openBtn.style.display = 'inline-block';
                openBtn.onclick = function () {
                    window.location.href = 'https://www.youtube.com/watch?v=' + currentVideoId;
                };
            }
        }

        function loadVideo() {
            const videoId = getVideoId();
            const player = document.getElementById('player');
            const error = document.getElementById('error');

            currentVideoId = videoId;

            if (!videoId) {
                showError('Please include the video ID in the URL (format: #vid=video ID).');
                return;
            }

            const params = new URLSearchParams({
                rel: '0',
                modestbranding: '1',
                playsinline: '1',
                autoplay: '1',
                controls: '1',
                fs: '1',
                iv_load_policy: '3'
            });

            player.src = 'https://www.youtube.com/embed/' + encodeURIComponent(videoId) + '?' + params;
            player.style.display = 'block';
            error.classList.remove('show');
        }

        loadVideo();
        window.addEventListener('hashchange', loadVideo);
    </script>
</body>
</html>
